<ion-menu side="start" contentId="modules-content" class="mobile-drawer">
  <ion-header class="drawer-header">
    <div class="user-drawer-card">
      <div class="drawer-avatar">
        {{ user()?.firstName?.charAt(0) || 'U' }}
      </div>
      <div class="drawer-info">
        <h3 class="name">{{ user()?.firstName || 'User' }} {{ user()?.lastName || '' }}</h3>
        <p class="role">{{ user()?.role || 'Employee' }} • {{ user()?.company?.name || 'HRSS' }}</p>
      </div>
    </div>
  </ion-header>

  <ion-content class="drawer-content">
    <ion-list lines="none" class="drawer-list">
      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/modules/home" routerLinkActive="active-link">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          Home
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/modules/leaves" routerLinkActive="active-link">
          <ion-icon slot="start" name="calendar-outline"></ion-icon>
          Leaves
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/modules/announcements" routerLinkActive="active-link">
          <ion-icon slot="start" name="megaphone-outline"></ion-icon>
          Announcements
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/modules/holidays" routerLinkActive="active-link">
          <ion-icon slot="start" name="sparkles-outline"></ion-icon>
          Holidays
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/modules/setting" routerLinkActive="active-link">
          <ion-icon slot="start" name="settings-outline"></ion-icon>
          Settings
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item class="logout-link" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          Sign Out
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>

  <ion-footer class="drawer-footer">
    <span>HRSS Mobile App v2.0 • Secured</span>
  </ion-footer>
</ion-menu>

<div class="ion-page" id="modules-content">
  <ion-header class="app-topbar">
    <ion-toolbar color="primary">
      <ion-buttons slot="start">
        <ion-menu-toggle>
          <ion-button>
            <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
      <ion-title class="topbar-title">HRSS Mobile</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="mobile-router-wrapper">
    <ion-router-outlet></ion-router-outlet>
  </div>
</div>
